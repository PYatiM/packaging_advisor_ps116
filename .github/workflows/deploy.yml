name: Build and Push Docker Images

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  API_IMAGE_NAME: ${{ github.repository_owner }}/packaging-advisor-api
  UI_IMAGE_NAME: ${{ github.repository_owner }}/packaging-advisor-ui

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Log in to GitHub Container Registry using the automatic GITHUB_TOKEN
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the FastAPI backend image
      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }}:latest

      # Build and push the Streamlit frontend image
      - name: Build and push UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.UI_IMAGE_NAME }}:latest
